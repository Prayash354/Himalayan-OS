name: Build Himalayan OS ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo docker image prune --all --force

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin mtools debian-archive-keyring

      - name: Bootstrap Debian Bookworm RootFS
        run: |
          sudo debootstrap --arch=amd64 --variant=minbase bookworm ./chroot http://deb.debian.org/debian/

      - name: Configure System and Install Packages
        run: |
          # Mount pseudo-filesystems
          sudo mount --bind /dev ./chroot/dev
          sudo mount --bind /dev/pts ./chroot/dev/pts
          sudo mount -t proc proc ./chroot/proc
          sudo mount -t sysfs sys ./chroot/sys

          # Install packages inside chroot
          sudo chroot ./chroot /bin/bash -c "
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends \
              linux-image-amd64 live-boot systemd-sysv \
              plasma-desktop sddm dolphin konsole firefox-esr network-manager calamares \
              fastfetch curl
          "

          # 1. Inject Taskbar Layout
          sudo mkdir -p ./chroot/etc/xdg/plasma-workspace
          cat << 'EOF' | sudo tee ./chroot/etc/xdg/plasma-workspace/layout.js > /dev/null
          var panel = new Panel();
          panel.height = 44;
          panel.location = "bottom";
          panel.addWidget("org.kde.plasma.kickoff");
          var icontasks = panel.addWidget("org.kde.plasma.icontasks");
          icontasks.currentConfigGroup = Array("General");
          icontasks.writeConfig("launchers", Array(
              "applications:org.kde.dolphin.desktop",
              "applications:firefox-esr.desktop",
              "applications:org.kde.konsole.desktop"
          ));
          panel.addWidget("org.kde.plasma.systemtray");
          panel.addWidget("org.kde.plasma.digitalclock");
          EOF

          # 2. Inject Wallpaper Configuration
          sudo mkdir -p ./chroot/usr/share/wallpapers/HimalayanOS/contents/images
          sudo mkdir -p ./chroot/etc/xdg
          cat << 'EOF' | sudo tee ./chroot/etc/xdg/plasmarc > /dev/null
          [Wallpaper][org.kde.image][General]
          Image=usr/share/wallpapers/HimalayanOS/contents/images/1920x1080.jpg
          EOF

          # 3. Inject Fastfetch & Shell Startup
          sudo mkdir -p ./chroot/etc/skel/.config/fastfetch
          cat << 'EOF' | sudo tee ./chroot/etc/skel/.config/fastfetch/config.jsonc > /dev/null
          {
            "$schema": "https://github.com",
            "logo": { "type": "small" },
            "modules": [
              "title",
              "separator",
              { "type": "os", "key": " 🏔️ OS ", "format": "Himalayan OS" },
              { "type": "wm", "key": " 🖥️ WM ", "format": "KDE Plasma" },
              "memory"
            ]
          }
          EOF

          cat << 'EOF' | sudo tee -a ./chroot/etc/skel/.bashrc > /dev/null

          # Welcome to Himalayan OS
          echo -e "\e[1;34m      ◢◣\e[0m"
          echo -e "\e[1;34m     ◢██◣     \e[1;31m■\e[0m"
          echo -e "\e[1;34m    ◢████◣    \e[1;31m■■\e[0m"
          echo -e "\e[1;34m   ◢██████◣   \e[1;31m■■■\e[0m"
          echo -e "\e[1;30m===🏔️ Himalayan OS 🇳🇵===\e[0m"
          if [ -f /usr/bin/fastfetch ]; then
              fastfetch --config ~/.config/fastfetch/config.jsonc
          fi
          EOF

          # Safely unmount all virtual filesystems
          sudo umount -l ./chroot/dev/pts
          sudo umount -l ./chroot/dev
          sudo umount -l ./chroot/proc
          sudo umount -l ./chroot/sys

      - name: Build Live ISO Image
        run: |
          mkdir -p iso/live iso/boot/grub

          # Package root filesystem into SquashFS
          sudo mksquashfs ./chroot iso/live/filesystem.squashfs -e boot

          # Copy kernel and initrd
          sudo cp ./chroot/boot/vmlinuz-* iso/live/vmlinuz
          sudo cp ./chroot/boot/initrd.img-* iso/live/initrd.img

          # Create GRUB boot configuration
          cat << 'EOF' | sudo tee iso/boot/grub/grub.cfg > /dev/null
          insmod part_gpt
          insmod part_msdos
          insmod fat
          insmod iso9660

          set default="0"
          set timeout=10

          menuentry "Himalayan OS Live" {
              linux /live/vmlinuz boot=live quiet splash
              initrd /live/initrd.img
          }
          EOF

          # Generate bootable ISO
          grub-mkrescue -o HimalayanOS-v1.iso iso/

      - name: Upload Himalayan OS ISO
        uses: actions/upload-artifact@v4
        with:
          name: HimalayanOS-Image
          path: HimalayanOS-v1.iso
