name: Build Himalayan OS ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo docker image prune --all --force

      - name: Install Build Dependencies & Keyrings
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap debian-archive-keyring curl git

      - name: Configure and Build Himalayan OS
        run: |
          sudo mkdir -p himalayan-build
          cd himalayan-build

          # Configure live-build cleanly
          sudo lb config \
            --distribution bookworm \
            --binary-images iso-hybrid \
            --architectures amd64 \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap "http://deb.debian.org/debian/" \
            --mirror-chroot "http://deb.debian.org/debian/" \
            --mirror-binary "http://deb.debian.org/debian/" \
            --keyring-packages debian-archive-keyring

          CHROOT_DIR="config/includes.chroot"

          # Create directory structures
          sudo mkdir -p "$CHROOT_DIR/etc/xdg/plasma-workspace"
          sudo mkdir -p "$CHROOT_DIR/usr/share/wallpapers/HimalayanOS/contents/images"
          sudo mkdir -p "$CHROOT_DIR/etc/skel/.config/fastfetch"
          sudo mkdir -p "$CHROOT_DIR/etc/default/grub.d"

          # 1. Inject Taskbar Layout
          cat << 'EOF' | sudo tee "$CHROOT_DIR/etc/xdg/plasma-workspace/layout.js" > /dev/null
          var panel = new Panel();
          panel.height = 44;
          panel.location = "bottom";
          panel.addWidget("org.kde.plasma.kickoff");
          var icontasks = panel.addWidget("org.kde.plasma.icontasks");
          icontasks.currentConfigGroup = Array("General");
          icontasks.writeConfig("launchers", Array(
              "applications:org.kde.dolphin.desktop",
              "applications:firefox-esr.desktop",
              "applications:org.kde.konsole.desktop"
          ));
          panel.addWidget("org.kde.plasma.systemtray");
          panel.addWidget("org.kde.plasma.digitalclock");
          EOF

          # 2. Inject Wallpaper Configuration
          cat << 'EOF' | sudo tee "$CHROOT_DIR/etc/xdg/plasmarc" > /dev/null
          [Wallpaper][org.kde.image][General]
          Image=usr/share/wallpapers/HimalayanOS/contents/images/1920x1080.jpg
          EOF

          # 3. Inject Shell Startup (.bashrc)
          cat << 'EOF' | sudo tee -a "$CHROOT_DIR/etc/skel/.bashrc" > /dev/null

          # Welcome to Himalayan OS
          echo -e "\e[1;34m      ◢◣\e[0m"
          echo -e "\e[1;34m     ◢██◣     \e[1;31m■\e[0m"
          echo -e "\e[1;34m    ◢████◣    \e[1;31m■■\e[0m"
          echo -e "\e[1;34m   ◢██████◣   \e[1;31m■■■\e[0m"
          echo -e "\e[1;30m===🏔️ Himalayan OS 🇳🇵===\e[0m"
          EOF

          # Build the ISO image
          sudo lb build

          # Find and rename the output ISO
          ISO_FILE=$(ls *.iso *.hybrid.iso 2>/dev/null | head -n 1)
          if [ -n "$ISO_FILE" ]; then
            sudo mv "$ISO_FILE" HimalayanOS-v1.iso
          fi

      - name: Upload Completed Himalayan OS ISO File
        uses: actions/upload-artifact@v4
        with:
          name: HimalayanOS-Image
          path: himalayan-build/HimalayanOS-v1.iso
