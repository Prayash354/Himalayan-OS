name: Build Himalayan OS ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-iso:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
      options: --privileged

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          apt-get update
          apt-get install -y live-build debootstrap curl git debian-archive-keyring isolinux syslinux-utils xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin

      - name: Configure and Build Himalayan OS
        run: |
          mkdir -p himalayan-build
          cd himalayan-build

          # Configure live-build
          lb config \
            --mode debian \
            --distribution bookworm \
            --binary-images iso-hybrid \
            --architectures amd64 \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap "http://deb.debian.org/debian/" \
            --mirror-chroot "http://deb.debian.org/debian/" \
            --mirror-binary "http://deb.debian.org/debian/"

          # Inject Package Lists
          mkdir -p config/package-lists
          cat << 'EOF' > config/package-lists/desktop.list.chroot
          live-boot
          live-config
          systemd-sysv
          plasma-desktop
          sddm
          dolphin
          konsole
          firefox-esr
          network-manager
          calamares
          calamares-settings-debian
          sudo
          desktop-base
          EOF

          CHROOT_DIR="config/includes.chroot"

          # Create directory structures
          mkdir -p "$CHROOT_DIR/etc/xdg/plasma-workspace"
          mkdir -p "$CHROOT_DIR/etc/skel/Desktop"

          # 1. Inject Taskbar Layout
          cat << 'EOF' > "$CHROOT_DIR/etc/xdg/plasma-workspace/layout.js"
          var panel = new Panel();
          panel.height = 44;
          panel.location = "bottom";
          panel.addWidget("org.kde.plasma.kickoff");
          var icontasks = panel.addWidget("org.kde.plasma.icontasks");
          icontasks.currentConfigGroup = Array("General");
          icontasks.writeConfig("launchers", Array(
              "applications:org.kde.dolphin.desktop",
              "applications:firefox-esr.desktop",
              "applications:org.kde.konsole.desktop"
          ));
          panel.addWidget("org.kde.plasma.systemtray");
          panel.addWidget("org.kde.plasma.digitalclock");
          EOF

          # 2. Inject Built-in Debian Wallpaper
          cat << 'EOF' > "$CHROOT_DIR/etc/xdg/plasmarc"
          [Wallpaper][org.kde.image][General]
          Image=usr/share/wallpapers/DebianTheme/contents/images/1920x1080.svg
          EOF

          # 3. Create Installer Shortcut on Live Desktop
          cat << 'EOF' > "$CHROOT_DIR/etc/skel/Desktop/install-himalayan.desktop"
          [Desktop Entry]
          Type=Application
          Version=1.0
          Name=Install Himalayan OS
          Comment=Install the system to disk
          Exec=sudo calamares
          Icon=calamares
          Terminal=false
          Categories=System;
          EOF
          chmod +x "$CHROOT_DIR/etc/skel/Desktop/install-himalayan.desktop"

          # 4. Inject Shell Startup
          cat << 'EOF' >> "$CHROOT_DIR/etc/skel/.bashrc"

          # Welcome to Himalayan OS
          echo -e "\e[1;34m      ◢◣\e[0m"
          echo -e "\e[1;34m     ◢██◣     \e[1;31m■\e[0m"
          echo -e "\e[1;34m    ◢████◣    \e[1;31m■■\e[0m"
          echo -e "\e[1;34m   ◢██████◣   \e[1;31m■■■\e[0m"
          echo -e "\e[1;30m===🏔️ Himalayan OS 🇳🇵===\e[0m"
          EOF

          # Build ISO
          lb build

          if [ -f live-image-amd64.hybrid.iso ]; then
            mv live-image-amd64.hybrid.iso HimalayanOS-v1.iso
          fi

      - name: Upload Completed Himalayan OS ISO File
        uses: actions/upload-artifact@v4
        with:
          name: HimalayanOS-Image
          path: himalayan-build/HimalayanOS-v1.iso
